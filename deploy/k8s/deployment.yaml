# One process, one SQLite database, one writer. Recreate + replicas: 1 is not
# a tuning choice: a second writer would corrupt or lock the database, and a
# RollingUpdate could briefly run two pods against the same ReadWriteOnce
# volume. Do not add an HPA or raise replicas (deploy/README.md says so
# plainly).
#
# Port 80 is the only listening port: UI, JSON API, /mcp, /healthz, share links
# and OTLP ingest (/v1/traces) all share it. Binding it as uid 65532 needs
# NET_BIND_SERVICE; the capability is the only one kept.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otterscope
  labels:
    app.kubernetes.io/name: otterscope
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: otterscope
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otterscope
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: otterscope
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otterscope
          image: ghcr.io/otterscope/otterscope:latest
          imagePullPolicy: IfNotPresent
          # The image default CMD is `serve -db /data/otterscope.db`; pass no
          # address flags because this build has a single HTTP listener on
          # port 80 and the database path comes from the ConfigMap.
          args:
            - serve
          envFrom:
            - configMapRef:
                name: otterscope-config
          env:
            # Optional. If the Secret does not exist the pod still starts and
            # the judge is simply unconfigured.
            - name: OTTERSCOPE_JUDGE_KEY
              valueFrom:
                secretKeyRef:
                  name: otterscope-judge
                  key: judge-key
                  optional: true
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              # Needed to bind :80 as uid 65532. Nothing else.
              add:
                - NET_BIND_SERVICE
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            # Up to 5 minutes for a large database to migrate before the
            # startup probe gives up; readiness/liveness only start afterwards.
            failureThreshold: 150
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: otterscope-data
