# Optional example only: NOT applied by kustomization.yaml.
#
# Copy to a file you do not commit, replace the placeholder, then:
#   kubectl -n otterscope apply -f judge-secret.yaml
#
# The Deployment references this key with optional: true, so the server starts
# without it and the judge feature simply stays unconfigured.
apiVersion: v1
kind: Secret
metadata:
  name: otterscope-judge
  namespace: otterscope
  labels:
    app.kubernetes.io/name: otterscope
    app.kubernetes.io/component: server
type: Opaque
stringData:
  judge-key: "sk-replace-with-a-real-judge-key"
