# Minimal self-hosted deployment: UI on 127.0.0.1:8317, OTLP ingest on
# 127.0.0.1:4318, data in a named volume, non-root, read-only root filesystem.
#
# The published ports bind the host's loopback address only. Read auth is not
# enabled below because the Rust binary does not implement `token add` or
# `project add` yet, so there is no way to mint the first token; until those
# land, keep these bindings on loopback and do not widen them. For anything
# wider than this machine, put a reverse proxy with TLS and real auth in front
# instead.
services:
  otterscope:
    image: ghcr.io/otterscope/otterscope:latest
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    # The image listens on loopback by default. Docker's port forwarding
    # delivers to the container's own address, so the container has to bind
    # 0.0.0.0 for the published ports to work at all; the 127.0.0.1 bindings
    # above are what keep it off the network.
    command:
      - serve
      - -db
      - /data/otterscope.db
      - -listen
      - 0.0.0.0:8317
      - -otlp
      - 0.0.0.0:4318
    ports:
      - "127.0.0.1:8317:8317"
      - "127.0.0.1:4318:4318"
    volumes:
      - otterscope-data:/data

volumes:
  otterscope-data:
