name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: darwin-arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: windows-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: build web
        working-directory: web
        run: bun install --frozen-lockfile && bun run build
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: rust
          target: ${{ matrix.target }}
      - name: set version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sed -i.bak -E "s/^version = \"[^\"]+\"/version = \"${version}\"/" rust/Cargo.toml
          rm -f rust/Cargo.toml.bak
          grep -qF "version = \"${version}\"" rust/Cargo.toml
      # Linux binaries link the runner's glibc (Ubuntu 24.04, glibc 2.39).
      # There is no musl/cross build yet, so they are not fully static; see
      # docs/packaging.md for the consequences and the deferred follow-up.
      - name: build
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }}
      - name: package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="otterscope_${version}_${{ matrix.artifact }}"
          mkdir -p "staging/${name}" artifacts
          cp "rust/target/${{ matrix.target }}/release/otterscope" "staging/${name}/"
          cp LICENSE README.md "staging/${name}/"
          tar -czf "artifacts/${name}.tar.gz" -C staging "${name}"
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $name = "otterscope_${version}_${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path "staging/$name" | Out-Null
          Copy-Item "rust/target/${{ matrix.target }}/release/otterscope.exe" "staging/$name/"
          Copy-Item LICENSE, README.md "staging/$name/"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "staging/$name" -DestinationPath "artifacts/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  container:
    name: container
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # arm64 is emulated under QEMU, so the Rust stage compiles slowly on the
      # first build. The layer cache keeps later tags cheap.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            version=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/otterscope/otterscope:${{ steps.version.outputs.value }}
            ghcr.io/otterscope/otterscope:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
