# reference-only: the Go tree is frozen while the Rust port replaces it. This
# workflow is kept for manual runs against the reference implementation and is
# not a pull-request gate; see rust.yml.
name: go (reference only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: build web
        working-directory: web
        run: bun install --frozen-lockfile && bun run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: CGO_ENABLED=0 go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -timeout 120s ./...
