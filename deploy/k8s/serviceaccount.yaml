# The server never calls the Kubernetes API, so it gets no token. Both the
# ServiceAccount and the pod set automountServiceAccountToken: false; either
# one alone is enough, and stating both keeps a future pod template honest.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otterscope
  labels:
    app.kubernetes.io/name: otterscope
automountServiceAccountToken: false
