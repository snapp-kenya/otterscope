# Daily consistent snapshot of the live SQLite database, written to the same
# PVC. The backup path is a directory under /data because /data is the only
# writable path in the image.
#
# The file name is unique per pod attempt, so a retried Job does not try to
# overwrite an existing snapshot (SQLite's VACUUM INTO refuses an existing
# file). Kubernetes expands $(POD_NAME) in args from the env var below.
#
# Snapshots are not pruned by this CronJob. Copy them off the volume and prune
# them on a schedule you own; see deploy/readme.md.
#
# podAffinity keeps the Job on the writer's node: the PVC is ReadWriteOnce, so
# a backup pod scheduled elsewhere would block on a multi-attach error. The
# trade-off is that backups wait while the server pod is absent.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: otterscope-backup
  labels:
    app.kubernetes.io/name: otterscope
    app.kubernetes.io/component: backup
spec:
  schedule: "17 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  suspend: false
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: otterscope
        app.kubernetes.io/component: backup
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: otterscope
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          serviceAccountName: otterscope
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: otterscope
                      app.kubernetes.io/component: server
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: backup
              # Same image as the Deployment, built from this repository and
              # pushed to *your* registry; replace the placeholder reference.
              image: registry.example.com/otterscope:latest
              imagePullPolicy: IfNotPresent
              command:
                - /usr/local/bin/otterscope
              args:
                - backup
                - -o
                - /data/backups/otterscope-$(POD_NAME).db
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
              envFrom:
                - configMapRef:
                    name: otterscope-config
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: otterscope-data
